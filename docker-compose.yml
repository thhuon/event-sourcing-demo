services:
  #######################################################
  #  Write side: EventStoreDB (event store)
  #######################################################
  eventstoredb:
    image: eventstore/eventstore:24.10.0-bookworm-slim
    # use this image if you're running ARM-based proc like Apple M1
    # image: eventstore/eventstore:24.10.0-alpha-arm64v8
    environment:
      - EVENTSTORE_CLUSTER_SIZE=1
      - EVENTSTORE_RUN_PROJECTIONS=All
      - EVENTSTORE_START_STANDARD_PROJECTIONS=true
      - EVENTSTORE_NODE_PORT=2113
      - EVENTSTORE_INSECURE=true
      - EVENTSTORE_ENABLE_ATOM_PUB_OVER_HTTP=true
    ports:
      - '2114:2113' # Web UI: http://localhost:2114
    volumes:
      - eventstore-data:/var/lib/eventstore
      - eventstore-logs:/var/log/eventstore

  #######################################################
  #  Read side: PostgreSQL (read model + checkpoint)
  #######################################################
  postgres:
    image: postgres:16-alpine
    ports:
      - '5436:5432'
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      # Runs 0001..0003 once, when the volume is empty
      - ./src/eventsourced/migrations:/docker-entrypoint-initdb.d:ro
      - postgres-data:/var/lib/postgresql/data

  #######################################################
  #  App: command API + query API + projector + demo UI
  #######################################################
  app:
    build: .
    ports:
      - '5000:5000' # Demo UI: http://localhost:5000
    environment:
      - ESDB_CONNECTION_STRING=esdb://eventstoredb:2113?tls=false
      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/postgres
    volumes:
      - ./public:/app/public:ro # edit the UI without rebuilding
    depends_on:
      - eventstoredb
      - postgres
    restart: unless-stopped

  #######################################################
  #  Optional: docker compose --profile tools up -d
  #######################################################
  pgadmin:
    image: dpage/pgadmin4
    profiles: ['tools']
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-pgadmin4@pgadmin.org}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    volumes:
      - pgadmin:/var/lib/pgadmin
    ports:
      - '${PGADMIN_PORT:-5050}:80'

volumes:
  eventstore-data:
  eventstore-logs:
  postgres-data:
  pgadmin:
